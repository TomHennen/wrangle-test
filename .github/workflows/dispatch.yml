name: Dispatch

# Thin entrypoint for workflow_dispatch. GitHub does not resolve
# ${{ inputs.* }} in uses: refs for workflow_dispatch triggers, so
# this workflow delegates to test-wrangle.yml (workflow_call) where
# the inputs context IS available in uses: refs.

on:
  workflow_dispatch:
    inputs:
      wrangle_ref:
        description: "wrangle ref to test (SHA, branch, or tag)"
        required: true
        type: string
      correlation_id:
        description: "Opaque ID for the dispatching workflow to locate this run"
        required: false
        type: string
        default: ""

concurrency:
  group: test-${{ inputs.wrangle_ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-wrangle.yml
    with:
      wrangle_ref: ${{ inputs.wrangle_ref }}
      correlation_id: ${{ inputs.correlation_id }}
    secrets: inherit
