name: Cleanup Integration Branches

# Janitor: deletes stale integration/* branches that leaked from
# canceled or crashed wrangle dispatch runs.
# See: https://github.com/TomHennen/wrangle/blob/main/test/integration/SPEC.md

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale integration branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_HOURS: "24"
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          CUTOFF_EPOCH=$(( $(date +%s) - MAX_AGE_HOURS * 3600 ))

          # List all integration/* branches
          BRANCHES="$(gh api "repos/${REPO}/git/matching-refs/heads/integration/" \
            --jq '.[].ref' 2>/dev/null || true)"

          if [[ -z "$BRANCHES" ]]; then
            printf 'No integration branches found.\n'
            exit 0
          fi

          DELETED=0
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            BRANCH="${ref#refs/heads/}"

            # Get the most recent commit date on this branch
            COMMIT_DATE="$(gh api "repos/${REPO}/commits?sha=${BRANCH}&per_page=1" \
              --jq '.[0].commit.committer.date' 2>/dev/null || true)"

            if [[ -z "$COMMIT_DATE" ]]; then
              printf 'WARNING: Could not get commit date for %s, skipping\n' "$BRANCH"
              continue
            fi

            COMMIT_EPOCH="$(date -d "$COMMIT_DATE" +%s 2>/dev/null || date -j -f '%Y-%m-%dT%H:%M:%SZ' "$COMMIT_DATE" +%s 2>/dev/null || true)"

            if [[ -n "$COMMIT_EPOCH" ]] && [[ "$COMMIT_EPOCH" -lt "$CUTOFF_EPOCH" ]]; then
              printf 'Deleting stale branch: %s (last commit: %s)\n' "$BRANCH" "$COMMIT_DATE"
              gh api "repos/${REPO}/git/refs/heads/${BRANCH}" --method DELETE 2>/dev/null || true
              DELETED=$((DELETED + 1))
            fi
          done <<< "$BRANCHES"

          printf 'Deleted %d stale integration branch(es).\n' "$DELETED"
