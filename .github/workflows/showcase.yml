name: Showcase

# Stable, non-template companion to test-wrangle.yml.template.
#
# Runs on every `v*` tag push and exercises *every* wrangle reusable
# workflow (build_shell, build_and_publish_container,
# build_and_publish_python, build_and_publish_npm, check_source_change)
# end to end against real GitHub Actions infrastructure. Two flavors:
#
#   - Tracking tags `vYYYYMMDD-<wrangle-sha>` — pushed automatically by
#     wrangle's own release-showcase.yml when its reusable workflows or
#     actions change on `main`. Marked as pre-releases. This is the
#     heartbeat that catches infra regressions (Sigstore root rotation,
#     registry API changes, action breakage) between wrangle releases —
#     event-driven instead of time-driven, so freshness tracks actual
#     wrangle changes rather than the wall clock.
#
#   - Curated tags `vX.Y.Z` — pushed by hand (or via the GitHub Release
#     UI) for the stable, clickable example artifacts in wrangle's
#     adopter-facing docs (TomHennen/wrangle#200).
#
# Either way the SLSA generator attaches each build's L3 provenance to
# the GitHub Release and the release-assets job adds the dist + SBOM.
# Driving runs through a real tag (not a `schedule:` trigger) is
# deliberate: wrangle gates provenance-upload-to-Release on
# refs/tags/*, so only a tag push exercises that path.
#
# Unlike the integration template this file is NOT generated and NOT
# pinned to a per-PR SHA — it lives on `main`.
#
# TODO(wrangle-test#10): wrangle's reusable workflows are pinned at
# `@main` because no wrangle release tag yet carries the npm/python
# workflows + release-events machinery. Repoint to a release tag once
# one exists, and drop the zizmor unpinned-uses suppressions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialize runs: prep force-pushes the shared `showcase-build` branch,
# so two overlapping runs must not race on it.
concurrency:
  group: showcase
  cancel-in-progress: false

permissions: {}

jobs:
  # Compute a unique package version for this run and stage it on the
  # `showcase-build` branch. PyPI and npm both reject re-publishing an
  # existing version, so every run needs a fresh one. The reusable
  # python/npm workflows build from a `ref` input, so the bumped version
  # has to be committed somewhere their checkout can see it — hence a
  # dedicated branch, force-pushed each run (no history accumulation).
  #
  # Version: a curated `vX.Y.Z` tag -> the tag (`v1.2.3` -> `1.2.3`); a
  # tracking `vYYYYMMDD-<sha>` tag -> a dev version keyed by the date; a
  # manual workflow_dispatch -> a dev version keyed by run id. Only the
  # published fixtures (python, npm) need the bump; the others (shell,
  # container, scan, and the build-only python-uv/pnpm jobs) build the
  # triggering commit directly and skip `needs: [prep]`.
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # force-push the showcase-build branch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # zizmor: ignore[artipacked] persist-credentials needed for git push
      - name: Stage versions on showcase-build
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_PART="${TAG#v}"
          if [[ "$VERSION_PART" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PY_VERSION="$VERSION_PART"
            NPM_VERSION="$VERSION_PART"
            printf 'Curated release: version %s\n' "$VERSION_PART"
          elif [[ "$VERSION_PART" =~ ^([0-9]{8})- ]]; then
            # Tracking tag vYYYYMMDD-<sha> -> PEP 440 dev / SemVer pre-release.
            # The date alone keys the version; the SHA in the tag is for
            # traceability on the wrangle side, not for package versions.
            DATE="${BASH_REMATCH[1]}"
            PY_VERSION="0.0.1.dev${DATE}"
            NPM_VERSION="0.0.1-dev.${DATE}"
            printf 'Tracking tag: python=%s npm=%s\n' "$PY_VERSION" "$NPM_VERSION"
          else
            # Manual workflow_dispatch — key the dev version by run id.
            PY_VERSION="0.0.1.dev${GITHUB_RUN_ID}"
            NPM_VERSION="0.0.1-dev.${GITHUB_RUN_ID}"
            printf 'Manual run: python=%s npm=%s\n' "$PY_VERSION" "$NPM_VERSION"
          fi

          sed -i "s/^version = .*/version = \"${PY_VERSION}\"/" python/pyproject.toml
          # `npm version` rewrites package.json AND package-lock.json so
          # `npm ci` in the build stays in sync.
          ( cd npm && npm version "$NPM_VERSION" --no-git-tag-version --allow-same-version )

          git config user.name "wrangle-showcase"
          git config user.email "wrangle-showcase@users.noreply.github.com"
          git add python/pyproject.toml npm/package.json npm/package-lock.json
          git commit -m "showcase: pin versions (python ${PY_VERSION}, npm ${NPM_VERSION})" \
            || printf 'No version change to commit\n'
          git push --force origin "HEAD:showcase-build"

  # ----- one job per wrangle build type --------------------------------

  shell:
    permissions:
      contents: read
    uses: TomHennen/wrangle/.github/workflows/build_shell.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      scan-path: shell

  # Container fixture — default verify-image: true path. Publishes to
  # ghcr.io; ghcr needs only GITHUB_TOKEN, no Trusted Publisher.
  container:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_container.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: container
      imagename: ghcr.io/tomhennen/wrangle-test-showcase
      registry: ghcr.io
      release-events: non-pull-request
      # The SLSA generator sometimes misdetects public repos as private
      # when the run was triggered by a ref pushed with a non-GITHUB_TOKEN
      # credential — which every showcase run is (tracking tags are pushed
      # by wrangle's release-showcase.yml via a PAT; curated tags are
      # pushed manually). Safe: wrangle-test is public and disposable.
      # Matches test-wrangle.yml.template.
      publish_provenance_for_private_repo: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # Container opt-out fixture — exercises verify-image: false so the
  # showcase covers that branch of the container workflow too. Uses its
  # own fixture dir (a clone of container/) so the reusable workflow's
  # path-derived artifact names don't collide with `container`.
  container-no-verify:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_container.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: container-no-verify
      imagename: ghcr.io/tomhennen/wrangle-test-showcase-no-verify
      registry: ghcr.io
      release-events: non-pull-request
      verify-image: false
      publish_provenance_for_private_repo: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # Python fixture (hatchling / PEP 517 path) — build + test (pytest) +
  # SLSA L3 provenance + wrangle's own verify. Built from showcase-build
  # so it picks up prep's version bump.
  python:
    needs: [prep]
    permissions:
      contents: write   # SLSA generator's upload-assets job; validated at startup
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: python
      ref: showcase-build
      release-events: non-pull-request

  # Python fixture (uv path) — exercises the uv tooling branch AND
  # verify-provenance: false. Build-only (publish coverage is in the
  # `python` job above), so it keeps a static version and builds the
  # triggering commit directly.
  python-uv:
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: python-uv
      release-events: non-pull-request
      verify-provenance: false

  # npm fixture — build + test (`npm test`) + SLSA L3 provenance +
  # wrangle's own verify. Built from showcase-build for the version bump.
  npm:
    needs: [prep]
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_npm.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: npm
      ref: showcase-build
      release-events: non-pull-request

  # pnpm fixture — exercises wrangle's pnpm tooling branch (Corepack,
  # `pnpm install --frozen-lockfile`, `pnpm pack`). Build-only: the pnpm
  # fixture shares the npm fixture's package name, so publishing both
  # would collide — publish coverage stays in the `npm` job. Static
  # version, builds the triggering commit directly (no prep).
  pnpm:
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_npm.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      path: pnpm
      release-events: non-pull-request

  # Source scan. Limited to osv + zizmor: scorecard needs default-branch
  # context (a `v*` tag push does not provide it) and dependency-review
  # is pull_request-only — neither fits a tag-triggered run.
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: TomHennen/wrangle/.github/workflows/check_source_change.yml@main # zizmor: ignore[unpinned-uses] see TODO(wrangle-test#10)
    with:
      tools: "osv zizmor"

  # ----- registry publish (adopter-owned, mirrors gh_workflow_examples) -

  # Publish the python dist to TestPyPI. Publishing lives here, not in
  # wrangle's reusable workflow, because PyPI Trusted Publishing binds
  # the OIDC token to the caller workflow's filename.
  publish-python:
    if: ${{ needs.python.outputs.should-release == 'true' }}
    needs: [python]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.python.outputs.dist-artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true
          packages-dir: dist/
          repository-url: "https://test.pypi.org/legacy/"

  # Publish the npm tarball to npmjs.org via Trusted Publishing (OIDC).
  publish-npm:
    if: ${{ needs.npm.outputs.should-release == 'true' }}
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publishing
      contents: read
    steps:
      # setup-node v6 + Node 24: npm 11.5.1+ (ships with Node 24) is the
      # minimum for OIDC publish, and v6 does not inject an empty
      # NODE_AUTH_TOKEN that would downgrade to legacy token auth.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.npm.outputs.dist-artifact-name }}
          path: dist/
      # `./` prefix is load-bearing: without it npm's package-arg parser
      # treats `dist/foo.tgz` as a GitHub shorthand instead of a file.
      # `--tag showcase` keeps these off the package's `latest` and
      # `integration` dist-tags — the npm fixture is shared with the
      # integration test (see test-wrangle.yml.template).
      - name: Publish to npmjs.org
        env:
          TARBALL: ${{ needs.npm.outputs.tarball }}
        run: npm publish "./dist/${TARBALL}" --provenance --tag showcase

  # ----- permanent example artifacts on the GitHub Release -------------

  # Stopgap until wrangle attaches build outputs to the Release itself
  # (TomHennen/wrangle#228). The SLSA generator already attaches each
  # build's L3 provenance (its upload-assets job fires on refs/tags/*);
  # this job adds the dist + SBOM so the Release is a complete worked
  # example (TomHennen/wrangle#200), and marks tracking-tag Releases as
  # pre-releases. Skipped on workflow_dispatch (no tag). Delete once
  # wrangle#228 ships.
  release-assets:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [python, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/edit the GitHub Release
    steps:
      # One download of every run artifact; each lands under
      # artifacts/<artifact-name>/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Attach dist + SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PYTHON_DIST: ${{ needs.python.outputs.dist-artifact-name }}
          PYTHON_META: ${{ needs.python.outputs.metadata-artifact-name }}
          NPM_DIST: ${{ needs.npm.outputs.dist-artifact-name }}
          NPM_META: ${{ needs.npm.outputs.metadata-artifact-name }}
        run: |
          set -euo pipefail
          mkdir -p upload
          # dist filenames carry package name + version (unique); SBOMs are
          # all `sbom.spdx.json`, so prefix them by build type.
          cp "artifacts/${PYTHON_DIST}"/* upload/
          cp "artifacts/${NPM_DIST}"/* upload/
          cp "artifacts/${PYTHON_META}/sbom.spdx.json" upload/python-sbom.spdx.json
          cp "artifacts/${NPM_META}/sbom.spdx.json" upload/npm-sbom.spdx.json

          # Curated `vX.Y.Z` -> full release; tracking `vYYYYMMDD-<sha>`
          # -> pre-release (keeps them out of the "Latest release" badge).
          create_flags=()
          version_part="${TAG#v}"
          if [[ ! "$version_part" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            create_flags+=(--prerelease)
          fi
          # The SLSA generator's upload-assets job usually created the
          # Release already; `|| true` covers the case where it has not.
          gh release create "$TAG" --title "$TAG" \
            --notes "wrangle-test showcase build — example wrangle outputs (SBOM, SLSA L3 provenance, dist)." \
            --verify-tag "${create_flags[@]}" || true
          if [[ ! "$version_part" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release edit "$TAG" --prerelease
          fi
          gh release upload "$TAG" upload/* --clobber

  # Prune old tracking tags + their pre-releases. Tracking tags
  # accumulate one-per-wrangle-main-push and are only useful as a
  # heartbeat — a 30-day window keeps "last month of showcase runs"
  # visible without burying the curated `vX.Y.Z` releases that are the
  # actual adopter-facing artifacts.
  #
  # Filters strictly on the `vYYYYMMDD-<sha7>` tag-name regex AND on
  # `prerelease: true` so a hand-cut `vX.Y.Z` (full release) is never
  # touched even if the regex matches by accident. Curated releases are
  # forever; tracking-tag retention is purely cosmetic.
  prune-tracking-tags:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete tags + releases
    steps:
      - name: Prune tracking tags older than KEEP_DAYS
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: "30"
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${KEEP_DAYS} days ago" +%Y%m%d)"
          printf 'Pruning tracking tags vYYYYMMDD-<sha> dated before %s\n' "$CUTOFF"

          # List all refs matching the tracking-tag prefix in one paginated call.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
            --jq '.[].ref' | while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            tag="${ref#refs/tags/}"
            # Strict tracking-tag shape: vYYYYMMDD-<7 hex chars>. Anything
            # else (curated vX.Y.Z, malformed, etc.) is left alone.
            [[ "$tag" =~ ^v([0-9]{8})-[0-9a-f]{7}$ ]] || continue
            date_part="${BASH_REMATCH[1]}"
            # 10# forces base-10 so a leading zero is not read as octal.
            (( 10#$date_part < 10#$CUTOFF )) || continue

            # Belt + suspenders: only delete if the Release is marked
            # prerelease. A hand-cut `vYYYYMMDD-abc1234` full release
            # (unlikely but possible) would survive this check.
            is_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq .prerelease 2>/dev/null || printf 'unknown')"
            if [[ "$is_prerelease" != "true" ]]; then
              printf 'SKIP %s (release prerelease=%s)\n' "$tag" "$is_prerelease"
              continue
            fi

            printf 'Pruning %s\n' "$tag"
            # --cleanup-tag deletes the Release and the tag together;
            # fall back to deleting the bare ref if there is no Release.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null \
              || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/${ref}" 2>/dev/null \
              || printf 'WARNING: could not prune %s\n' "$tag"
          done
