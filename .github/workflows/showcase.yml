name: Showcase

# Stable, non-template companion to test-wrangle.yml.template: it runs the
# real adopter-facing workflows end to end, where the template runs them
# per-PR pinned to a PR SHA.
#
# This is the `@main` heartbeat: it fires on tracking tags
# `vYYYYMMDD-<wrangle-sha7>` (pushed automatically by wrangle's
# release-showcase.yml on every push to main), builds against wrangle's
# current dev, and catches infra regressions (Sigstore root rotation,
# registry/API changes) before a release. Tracking-tag builds are marked as
# pre-releases and pruned after 30 days. Because the build ref is a branch,
# the VSA is not release-tag signed, so the verify-vsa gate runs in
# non-release dogfood mode (WRANGLE_VSA_NON_STRICT=1).
#
# Curated `vX.Y.Z` releases — the stable, strict-verifiable example artifacts
# in wrangle's adopter docs — are built at a release-tag pin by the separate
# showcase-curated.yml; the dash-vs-dot tag globs keep the two paths from
# firing on the same tag.
#
# Tag-driven, not schedule-driven, on purpose: wrangle gates VSA-attach-to-
# Release on refs/tags/*, so only a tag push exercises that path.
#
# Three sections, fenced below: the build-type example jobs (each mirrors a
# gh_workflow_examples/ template — the part an adopter copies), the adopter-
# owned registry-publish jobs (separate because Trusted Publishing binds the
# OIDC token to the caller workflow's filename), and the showcase harness
# (prep / create-release / prune-tracking-tags) — test plumbing that exists
# only because one repo runs every ecosystem off one tag, publishes to
# registries that reject version reuse, and accumulates tracking tags to
# prune. Ignore the harness when reading for "how do I use wrangle for X".

on:
  push:
    tags: ["v*-*"]   # tracking tags only; curated vX.Y.Z -> showcase-curated.yml
  workflow_dispatch:

# prep force-pushes the shared `showcase-build` branch, so overlapping runs
# must not race on it.
concurrency:
  group: showcase
  cancel-in-progress: false

permissions: {}

jobs:
  # ===================================================================
  # Build-type examples — each mirrors a gh_workflow_examples/ template
  # and is the part an adopter reads and copies.
  # ===================================================================

  shell:
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: read
    uses: TomHennen/wrangle/.github/workflows/build_shell.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      scan-path: shell

  # Publishes to ghcr.io; ghcr needs only GITHUB_TOKEN, no Trusted Publisher.
  container:
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: read
      packages: write
      id-token: write
      attestations: write   # wrangle attest job (actions/attest-build-provenance)
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_container.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: container
      imagename: ghcr.io/tomhennen/wrangle-test-showcase
      registry: ghcr.io
      release-events: non-pull-request
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # PEP 517 build + pytest + SLSA L3 provenance + verify. Built from the
  # showcase-build branch for prep's per-run version bump (see harness below).
  python-pip:
    needs: [prep, create-release]
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: write   # wrangle's verify job (attach VSA to release); validated at startup
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: python-pip
      ref: showcase-build
      release-events: non-pull-request

  # uv tooling branch. Build-only (publish coverage is in `python-pip`), so
  # static version, builds the triggering commit.
  python-uv:
    needs: [create-release]
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: python-uv
      release-events: non-pull-request

  # npm ci + npm test + npm pack + SLSA L3 provenance + verify. Built from
  # showcase-build for prep's version bump (see harness below).
  npm:
    needs: [prep, create-release]
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_npm.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: npm
      ref: showcase-build
      release-events: non-pull-request

  # pnpm tooling branch (Corepack, frozen-lockfile, pnpm pack). Build-only:
  # publish coverage for the npm ecosystem stays in `npm`. Static version,
  # builds the triggering commit.
  pnpm:
    needs: [create-release]
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_npm.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: pnpm
      release-events: non-pull-request

  # goreleaser build + SLSA L3 provenance + verify. Unlike python/npm,
  # wrangle's Go workflow owns publish to the GitHub Release, so there's no
  # separate publish-go job and no version bump (GitHub Releases don't reject
  # reuse).
  go:
    needs: [create-release]
    permissions:
      actions: read         # source scan: Scorecard reads the Actions API
      security-events: write  # source-scan SARIF -> Security tab
      contents: write   # goreleaser creates the Release; wrangle's verify job attaches the VSA
      id-token: write
      attestations: write   # wrangle attest job (actions/attest-build-provenance)
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_go.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      path: go
      release-events: non-pull-request

  # Source scan, limited to osv + zizmor: scorecard needs default-branch
  # context (a tag push doesn't provide it) and dependency-review is
  # pull_request-only — neither fits a tag-triggered run.
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: TomHennen/wrangle/.github/workflows/check_source_change.yml@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
    with:
      tools: "osv zizmor"

  # ===================================================================
  # Registry publish — adopter-owned (mirrors gh_workflow_examples).
  # Lives here, not in wrangle's reusable workflow, because Trusted
  # Publishing binds the OIDC token to the caller workflow's filename.
  # ===================================================================

  publish-python:
    if: ${{ needs.python-pip.outputs.should-release == 'true' }}
    needs: [python-pip]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publishing + PEP 740 attestations
    # The showcase builds wrangle at @main, so its VSA signer ref is a branch,
    # not a release tag — run wrangle's verify-vsa gate in non-release dogfood
    # mode. The shipped default (release tag required) is what real adopters,
    # who pin a release tag, get.
    env:
      WRANGLE_VSA_NON_STRICT: "1"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.python-pip.outputs.dist-artifact-name }}
          path: dist/
      # Verify this job's own download against wrangle's signed VSA — the
      # full policy verdict — before any bytes leave for the registry.
      - uses: TomHennen/wrangle/actions/verify-vsa@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
        with:
          path: dist/
          resource-uri: ${{ needs.python-pip.outputs.resource-uri }}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true
          packages-dir: dist/
          repository-url: "https://test.pypi.org/legacy/"

  publish-npm:
    if: ${{ needs.npm.outputs.should-release == 'true' }}
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publishing
      contents: read
    # Showcase builds wrangle at @main (branch ref, not a release tag), so run
    # wrangle's verify-vsa gate in non-release dogfood mode; real adopters pin a
    # release tag and get the shipped strict default.
    env:
      WRANGLE_VSA_NON_STRICT: "1"
    steps:
      # setup-node v6 + Node 24: npm 11.5.1+ (ships with Node 24) is the
      # minimum for OIDC publish, and v6 does not inject an empty
      # NODE_AUTH_TOKEN that would downgrade to legacy token auth.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.npm.outputs.dist-artifact-name }}
          path: dist/
      # Verify this job's own download against wrangle's signed VSA — the
      # full policy verdict — before any bytes leave for the registry.
      - uses: TomHennen/wrangle/actions/verify-vsa@main # zizmor: ignore[unpinned-uses] @main heartbeat: builds wrangle's current dev, not a release
        with:
          path: dist/
          resource-uri: ${{ needs.npm.outputs.resource-uri }}
      # `./` prefix is load-bearing: without it npm's package-arg parser
      # treats `dist/foo.tgz` as a GitHub shorthand instead of a file.
      # `--tag showcase` keeps these off the package's `latest` and
      # `integration` dist-tags — the npm fixture is shared with the
      # integration test (see test-wrangle.yml.template).
      - name: Publish to npmjs.org
        env:
          TARBALL: ${{ needs.npm.outputs.tarball }}
        run: npm publish "./dist/${TARBALL}" --provenance --tag showcase

  # ===================================================================
  # Showcase harness — test plumbing, not adopter examples. Skip when
  # reading for "how do I use wrangle for X".
  # ===================================================================

  # Compute a unique package version for this run and stage it on the
  # `showcase-build` branch. PyPI and npm both reject re-publishing an
  # existing version, so every run needs a fresh one. The reusable
  # python/npm workflows build from a `ref` input, so the bumped version
  # has to be committed somewhere their checkout can see it — hence a
  # dedicated branch, force-pushed each run (no history accumulation).
  # Only the published fixtures (python, npm) need it; the others build
  # the triggering commit directly and skip `needs: [prep]`.
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # force-push the showcase-build branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 # zizmor: ignore[artipacked] persist-credentials needed for git push
      - name: Stage versions on showcase-build
        run: |
          set -euo pipefail
          # Tracking tags and manual dispatch both build a per-run dev version:
          # PyPI/npmjs reject re-publishing a version, and wrangle pushes several
          # tracking tags per day, so uniqueness is keyed on the run id. PEP 440's
          # dev segment is a single integer, so there's no room for the SHA.
          PY_VERSION="0.0.1.dev${GITHUB_RUN_ID}"
          NPM_VERSION="0.0.1-dev.${GITHUB_RUN_ID}"
          printf 'python=%s npm=%s\n' "$PY_VERSION" "$NPM_VERSION"

          sed -i "s/^version = .*/version = \"${PY_VERSION}\"/" python-pip/pyproject.toml
          # `npm version` rewrites package.json AND package-lock.json so
          # `npm ci` in the build stays in sync.
          ( cd npm && npm version "$NPM_VERSION" --no-git-tag-version --allow-same-version )

          git config user.name "wrangle-showcase"
          git config user.email "wrangle-showcase@users.noreply.github.com"
          git add python-pip/pyproject.toml npm/package.json npm/package-lock.json
          git commit -m "showcase: pin versions (python ${PY_VERSION}, npm ${NPM_VERSION})" \
            || printf 'No version change to commit\n'
          # Fully qualify dst: with src=HEAD (detached, no local branch),
          # git won't auto-qualify if the remote branch doesn't yet exist.
          git push --force origin "HEAD:refs/heads/showcase-build"

  # Create the Release up front so wrangle's verify jobs have one to attach the
  # rationalized asset set to — wrangle owns the uploads now (TomHennen/wrangle
  # #228, #501), and its attach no-ops when no Release exists. Published, not a
  # draft: GitHub's by-tag release endpoint (what wrangle's `gh release view
  # <tag>` / `gh release upload <tag>` use) does not return drafts, so a draft
  # would be invisible to the attach. Runs on every event (no-op off a tag) so
  # it's a safe `needs:` for the build jobs.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release
    steps:
      - name: Create Release for the tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # this job has no checkout; gh needs the repo
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tracking tags are pre-releases, keeping them out of the "Latest
          # release" badge; they're pruned after 30 days by prune-tracking-tags.
          # `|| true` keeps a re-run idempotent (the Release already exists).
          gh release create "$TAG" --title "$TAG" \
            --notes "wrangle-test showcase build — example wrangle outputs (SBOM, signed SLSA VSA, dist)." \
            --verify-tag --prerelease || true

  # Golden-set assertion over the assembled release: the rationalized asset
  # set and each bundle's predicate types must match the showcase config's
  # checked-in goldens. Catches a silently no-op'd asset attach (#501) and a
  # missing scan attestation (#492). The showcase runs the default scan tools
  # (osv/zizmor/wrangle-lint), so it checks the fuller `showcase` golden.
  golden:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [python-pip, python-uv, npm, pnpm, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # gh release download (read the assembled release)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert release assets + bundle predicates match the showcase golden
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tools/golden/check_golden.sh assets     tools/golden/showcase "$TAG"
          tools/golden/check_golden.sh predicates tools/golden/showcase "$TAG"

  # Prune old tracking tags + their pre-releases. Tracking tags accumulate
  # one-per-wrangle-main-push and are only useful as a heartbeat — a 30-day
  # window keeps "last month of showcase runs" visible without burying the
  # curated `vX.Y.Z` releases. Filters strictly on the `vYYYYMMDD-<sha7>`
  # regex AND `prerelease: true`, so a hand-cut `vX.Y.Z` is never touched.
  prune-tracking-tags:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [python-pip, python-uv, npm, pnpm, go]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete tags + releases
    steps:
      - name: Prune tracking tags older than KEEP_DAYS
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: "30"
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d "${KEEP_DAYS} days ago" +%Y%m%d)"
          printf 'Pruning tracking tags vYYYYMMDD-<sha> dated before %s\n' "$CUTOFF"

          # List all refs matching the tracking-tag prefix in one paginated call.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
            --jq '.[].ref' | while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            tag="${ref#refs/tags/}"
            # Strict tracking-tag shape: vYYYYMMDD-<7 hex chars>. Anything
            # else (curated vX.Y.Z, malformed, etc.) is left alone.
            [[ "$tag" =~ ^v([0-9]{8})-[0-9a-f]{7}$ ]] || continue
            date_part="${BASH_REMATCH[1]}"
            # 10# forces base-10 so a leading zero is not read as octal.
            (( 10#$date_part < 10#$CUTOFF )) || continue

            # Belt + suspenders: only delete if the Release is marked
            # prerelease. A hand-cut `vYYYYMMDD-abc1234` full release
            # (unlikely but possible) would survive this check.
            is_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq .prerelease 2>/dev/null || printf 'unknown')"
            if [[ "$is_prerelease" != "true" ]]; then
              printf 'SKIP %s (release prerelease=%s)\n' "$tag" "$is_prerelease"
              continue
            fi

            printf 'Pruning %s\n' "$tag"
            # --cleanup-tag deletes the Release and the tag together;
            # fall back to deleting the bare ref if there is no Release.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null \
              || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/${ref}" 2>/dev/null \
              || printf 'WARNING: could not prune %s\n' "$tag"
          done
